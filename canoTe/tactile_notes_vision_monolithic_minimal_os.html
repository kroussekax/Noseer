<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <title>Tactile Notes & Vision - Monolithic Minimal OS</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <meta content="mobile_tab" name="shell-type">
  
  <!-- Critical Material Symbols Font -->

  <!-- Typography Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..700;1,300..700&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

  <style>

        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #131315;
      }
      body {
        overscroll-behavior: none;

        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

  <script src="https://cdn.tailwindcss.com"></script>

      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error-container": "#93000a",
            "on-primary-fixed": "#1a1c1d",
            "surface-container-lowest": "#0e0e10",
            "secondary": "#c6c5cf",
            "on-tertiary": "#303037",
            "surface-container-low": "#1b1b1d",
            "on-secondary-container": "#bcbbc5",
            "on-background": "#e5e1e4",
            "inverse-primary": "#5d5e60",
            "tertiary-fixed": "#e3e1ea",
            "surface-container": "#201f21",
            "secondary-fixed": "#e3e1ec",
            "secondary-fixed-dim": "#c6c5cf",
            "surface-tint": "#c6c6c7",
            "on-primary-fixed-variant": "#454748",
            "error": "#ffb4ab",
            "inverse-surface": "#e5e1e4",
            "on-error-container": "#ffdad6",
            "surface-dim": "#131315",
            "background": "#131315",
            "surface-variant": "#353437",
            "on-surface": "#e5e1e4",
            "on-primary": "#2f3132",
            "on-surface-variant": "#c4c7c9",
            "on-primary-container": "#636466",
            "outline-variant": "#444749",
            "tertiary-container": "#e3e1ea",
            "primary-fixed": "#e2e2e3",
            "secondary-container": "#4a4b53",
            "primary-container": "#e2e2e3",

            "tertiary": "#ffffff",

            "on-tertiary-fixed": "#1b1b21",

            "on-error": "#690005",

            "surface-container-high": "#2a2a2c",
            "on-tertiary-fixed-variant": "#46464d",
            "surface-bright": "#39393b",
            "on-secondary-fixed": "#1a1b22",
            "primary": "#ffffff",
            "primary-fixed-dim": "#c6c6c7",
            "outline": "#8e9193",
            "tertiary-fixed-dim": "#c7c5ce",
            "on-secondary": "#2f3038",
            "surface": "#131315"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          spacing: {
            "margin": "1rem",
            "space-sm": "0.5rem",
            "gutter-tablet": "1.25rem",
            "space-lg": "1.25rem",
            "space-xl": "2rem",
            "gutter-desktop": "1.5rem",
            "margin-tablet": "1.5rem",
            "margin-desktop": "2rem",
            "space-xs": "0.25rem",
            "space-md": "0.75rem",
            "gutter": "1rem"
          },
          fontFamily: {
            "label-md": ["JetBrains Mono", "monospace"],
            "display-lg-mobile": ["Space Grotesk", "sans-serif"],
            "body-md": ["Hanken Grotesk", "sans-serif"],
            "headline-lg": ["Space Grotesk", "sans-serif"],
            "body-lg": ["Hanken Grotesk", "sans-serif"],
            "label-lg": ["JetBrains Mono", "monospace"],
            "headline-lg-mobile": ["Space Grotesk", "sans-serif"],
            "display-lg": ["Space Grotesk", "sans-serif"],
            "headline-md": ["Space Grotesk", "sans-serif"],
            "label-sm": ["JetBrains Mono", "monospace"],
            "body-sm": ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- Required CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
  <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col selection:bg-surface-container-highest">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // Top Header Component
    const Header = ({ title, showSettingsActive = false }) => {
      return (
        <header className="fixed top-0 left-0 w-full z-40 pt-safe pointer-events-none">
          <div className="absolute top-2 right-4 pointer-events-auto flex items-center gap-3 text-on-surface/80">
            <Link 
              aria-label="Alerts" 
              to="/notifications" 
              className="hover:text-primary transition-colors flex items-center justify-center font-label-md text-[18px] font-bold"
            >
              <span className="material-symbols-outlined text-[20px]">priority_high</span>
            </Link>
            <Link 
              aria-label="Settings" 
              to="/settings" 
              className={`hover:text-primary transition-colors flex items-center justify-center font-label-md text-[18px] font-bold ${showSettingsActive ? 'text-primary' : ''}`}
            >
              @
            </Link>
          </div>
          <div className="w-full flex flex-col items-center justify-center pt-8 pb-3 pointer-events-auto">
            <div className="flex items-center gap-2">
              <span className="text-on-surface/60 font-label-md text-xl">·</span>
              <h1 className="font-headline-lg text-2xl tracking-[0.3em] uppercase font-bold text-on-surface">
                {title}
              </h1>
              <span className="text-on-surface/60 font-label-md text-xl">·</span>
            </div>
            <svg className="w-28 h-3 text-on-surface/40 mt-1" fill="none" stroke="currentColor" strokeLinecap="round" strokeWidth="1.8" viewBox="0 0 100 8">
              <path d="M 2 4 Q 10 1, 18 4 T 34 4 T 50 4 T 66 4 T 82 4 T 98 4"></path>
            </svg>
          </div>
        </header>
      );
    };

    // Shared Tactile Cards Grid Component
    const TactileCardGrid = () => {
      const [cardOneActive, setCardOneActive] = useState(false);
      const [cardTwoValue, setCardTwoValue] = useState(1420.50);

      const bumpMetrics = () => {
        setCardTwoValue(prev => Number((prev + 120.25).toFixed(2)));
      };

      return (
        <div className="grid grid-cols-2 gap-3.5 w-full">
          {/* Card 1: Lecture Items */}
          <div 
            onClick={() => setCardOneActive(!cardOneActive)}
            className="tactile-card group relative flex flex-col justify-between h-56 bg-surface-container rounded-2xl p-3.5 shadow-md overflow-hidden cursor-pointer border border-surface-container-highest/50 transition-transform duration-300 hover:-translate-y-1 active:scale-[0.98]"
          >
            <div className="flex items-center justify-between">
              <span className="font-label-sm text-[11px] text-outline font-semibold tracking-wider">I. LECTURE</span>
              <span className="font-label-sm text-[10px] text-outline-variant uppercase">10 Q</span>
            </div>
            <div className="my-auto flex flex-col gap-2 py-1">
              <div className="flex items-center justify-between">
                <span className="font-label-sm text-xs text-on-surface-variant font-medium">1.</span>
                <div className={`h-1.5 flex-1 mx-2 rounded-full transition-all duration-300 ${cardOneActive ? 'bg-primary' : 'bg-surface-container-highest'}`}></div>
                <span className="font-label-sm text-[10px] text-outline">10 Q</span>
              </div>
              <div className="flex items-center justify-between">
                <span className="font-label-sm text-xs text-on-surface-variant font-medium">II.</span>
                <div className="h-1.5 flex-1 mx-2 rounded-full bg-surface-container-highest/80"></div>
                <span className="font-label-sm text-[10px] text-outline">4 R</span>
              </div>
              <div className="flex items-center justify-between">
                <span className="font-label-sm text-xs text-on-surface-variant font-medium">III.</span>
                <div className="h-1.5 flex-1 mx-2 rounded-full bg-surface-container-highest/60"></div>
                <span className="font-label-sm text-[10px] text-outline">10 R</span>
              </div>
            </div>
            <div className="pt-2 border-t border-dashed border-outline-variant/40 flex items-center justify-between">
              <svg className="w-16 h-5 text-on-surface/70" fill="none" stroke="currentColor" strokeLinecap="round" strokeWidth="1.4" viewBox="0 0 70 20">
                <path d="M 4 14 C 10 6, 14 16, 22 10 C 30 4, 32 16, 44 12 C 54 8, 60 14, 66 12"></path>
              </svg>
              <span className={`w-1.5 h-1.5 rounded-full transition-colors ${cardOneActive ? 'bg-primary scale-125' : 'bg-primary'}`}></span>
            </div>
            <div className="peel-corner absolute bottom-0 right-0 w-8 h-8 pointer-events-none">
              <div className="peel-flap absolute bottom-0 right-0 w-full h-full bg-surface-container-highest transition-all duration-300 group-hover:w-10 group-hover:h-10 rounded-tl-lg shadow-[-3px_-3px_8px_rgba(0,0,0,0.6)]"></div>
              <div className="peel-under absolute bottom-0 right-0 w-full h-full bg-surface-container-lowest -z-10"></div>
            </div>
          </div>

          {/* Card 2: Metrics */}
          <div 
            onClick={bumpMetrics}
            className="tactile-card group relative flex flex-col justify-between h-56 bg-surface-container rounded-2xl p-3.5 shadow-md overflow-hidden cursor-pointer border border-surface-container-highest/50 transition-transform duration-300 hover:-translate-y-1 active:scale-[0.98]"
          >
            <div className="flex items-center justify-between">
              <span className="font-label-sm text-[11px] text-outline font-semibold tracking-wider">METRICS</span>
              <span className="material-symbols-outlined text-outline-variant text-[16px]">bar_chart</span>
            </div>
            <div className="my-auto flex flex-col items-center justify-center">
              <div className="w-full flex items-end justify-center gap-2 h-20 pt-2 pb-1">
                <div className="w-3 h-10 rounded-sm bg-surface-container-highest"></div>
                <div className="w-3 h-14 rounded-sm bg-primary/70 group-hover:h-16 transition-all duration-300"></div>
                <div className="w-3 h-8 rounded-sm bg-surface-container-highest"></div>
                <div className="w-3 h-16 rounded-sm bg-primary group-hover:h-18 transition-all duration-300"></div>
                <div className="w-3 h-12 rounded-sm bg-surface-container-highest"></div>
              </div>
              <div className="w-full flex items-center justify-center border-t border-dashed border-outline-variant/40 pt-1.5">
                <span className="font-label-sm text-[10px] text-outline">WEEKLY TREND</span>
              </div>
            </div>
            <div className="flex items-center justify-between pt-1">
              <span className="font-label-sm text-[11px] text-outline">${cardTwoValue.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
              <span className="font-label-sm text-[10px] text-outline-variant">9 bills</span>
            </div>
            <div className="peel-corner absolute bottom-0 right-0 w-8 h-8 pointer-events-none">
              <div className="peel-flap absolute bottom-0 right-0 w-full h-full bg-surface-container-highest transition-all duration-300 group-hover:w-10 group-hover:h-10 rounded-tl-lg shadow-[-3px_-3px_8px_rgba(0,0,0,0.6)]"></div>
              <div className="peel-under absolute bottom-0 right-0 w-full h-full bg-surface-container-lowest -z-10"></div>
            </div>
          </div>
        </div>
      );
    };

    // Shared Search Overlay Component
    const SearchOverlay = ({ isOpen, onClose, placeholder = "Search notes..." }) => {
      const [term, setTerm] = useState("");

      return (
        <div 
          id="floating-search-bar" 
          className={`fixed inset-x-4 bottom-24 z-50 transition-all duration-300 ${
            isOpen ? 'opacity-100 pointer-events-auto translate-y-0' : 'opacity-0 pointer-events-none translate-y-3'
          }`}
        >
          <div className="max-w-md mx-auto w-full bg-surface-container-high/90 backdrop-blur-xl border border-surface-container-highest/60 rounded-full h-11 px-4 flex items-center justify-between shadow-[0_12px_32px_-4px_rgba(0,0,0,0.7)] focus-within:border-primary transition-colors pointer-events-auto">
            <div className="flex items-center gap-2 flex-1">
              <span className="font-label-sm text-xs text-outline tracking-widest">······</span>
              <input 
                id="search-input" 
                value={term}
                onChange={(e) => setTerm(e.target.value)}
                className="bg-transparent text-sm text-on-surface placeholder:text-outline-variant focus:outline-none w-full font-body-md" 
                placeholder={placeholder} 
                type="text" 
              />
            </div>
            <button 
              id="close-search-btn" 
              type="button" 
              onClick={onClose}
              className="text-on-surface-variant hover:text-on-surface flex items-center justify-center p-1 focus:outline-none"
            >
              <span className="material-symbols-outlined text-[20px]">{term ? 'close' : 'search'}</span>
            </button>
          </div>
        </div>
      );
    };

    // Global Floating Navigation Bar
    const NavigationBar = ({ activeTab, onToggleSearch }) => {
      return (
        <nav className="fixed bottom-0 w-full z-50 pb-safe pointer-events-none flex justify-center">
          <div className="pointer-events-auto mb-6 mx-auto flex items-center gap-2">
            <div className="bg-surface-container-high/90 backdrop-blur-xl shadow-[0_12px_32px_-4px_rgba(0,0,0,0.7)] rounded-full px-space-sm py-1.5 flex items-center gap-space-xs">
              <Link 
                aria-label="Notes" 
                to="/" 
                className={`rounded-full flex items-center justify-center transition-all active:scale-95 ${
                  activeTab === 'notes'
                    ? 'min-w-[48px] min-h-[48px] bg-primary text-on-primary shadow-sm'
                    : 'min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface'
                }`}
              >
                <span className="material-symbols-outlined text-[22px]">description</span>
              </Link>
              
              <Link 
                aria-label="Active Camera" 
                to="/camera" 
                className={`rounded-full flex items-center justify-center transition-all active:scale-95 ${
                  activeTab === 'camera'
                    ? 'min-w-[48px] min-h-[48px] bg-primary text-on-primary shadow-sm'
                    : 'min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface'
                }`}
              >
                <span className="material-symbols-outlined text-[22px]">photo_camera</span>
              </Link>
              
              <Link 
                aria-label="Gallery" 
                to="/gallery" 
                className={`rounded-full flex items-center justify-center transition-all active:scale-95 ${
                  activeTab === 'gallery'
                    ? 'min-w-[48px] min-h-[48px] bg-primary text-on-primary shadow-sm'
                    : 'min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface'
                }`}
              >
                <span className="material-symbols-outlined text-[22px]">photo_library</span>
              </Link>
            </div>

            <button 
              aria-label="Search" 
              type="button"
              onClick={onToggleSearch}
              className="w-12 h-12 rounded-full flex items-center justify-center bg-surface-container-high/90 backdrop-blur-xl shadow-[0_12px_32px_-4px_rgba(0,0,0,0.7)] text-on-surface-variant hover:text-on-surface active:scale-95 transition-all"
            >
              <span className="material-symbols-outlined text-[22px]">search</span>
            </button>
          </div>
        </nav>
      );
    };

    // SCREEN 1: Notes Screen
    const NotesScreen = () => {
      const [searchOpen, setSearchOpen] = useState(false);

      return (
        <div className="min-h-screen flex flex-col bg-surface text-on-surface selection:bg-surface-container-highest">
          <Header title="NOTES" />
          <main className="flex-1 flex flex-col relative w-full pt-14 pb-28 px-margin bg-surface">
            <div className="flex flex-col w-full h-full min-h-[calc(100vh-140px)] justify-between select-none pt-16 pb-24 px-margin">
              <div className="flex flex-col gap-4 w-full">
                <TactileCardGrid />
              </div>
            </div>
            <SearchOverlay 
              isOpen={searchOpen} 
              onClose={() => setSearchOpen(false)} 
              placeholder="Search notes..." 
            />
          </main>
          <NavigationBar activeTab="notes" onToggleSearch={() => setSearchOpen(!searchOpen)} />
        </div>
      );
    };

    // SCREEN 2: Camera Viewfinder Screen
    const CameraScreen = () => {
      const [flashing, setFlashing] = useState(false);
      const [captureCount, setCaptureCount] = useState(0);

      const triggerShutter = () => {
        setFlashing(true);
        setCaptureCount(prev => prev + 1);
        setTimeout(() => {
          setFlashing(false);
        }, 120);
      };

      return (
        <div className="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col selection:bg-surface-container-highest relative">
          <main className="flex-1 flex flex-col relative w-full bg-surface">
            <div className="relative w-full h-full min-h-screen flex flex-col justify-between overflow-hidden bg-surface select-none">
              
              {/* Shutter visual flash overlay */}
              <div 
                id="shutter-flash"
                className={`absolute inset-0 bg-primary pointer-events-none transition-opacity duration-150 z-30 ${
                  flashing ? 'opacity-90' : 'opacity-0'
                }`}
              ></div>

              {/* Viewfinder grid lines */}
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
                <div className="w-64 h-64 border border-dashed border-outline rounded-3xl relative">
                  <div className="absolute top-2 left-2 text-[10px] font-label-sm tracking-widest text-outline">EV +0.0</div>
                  <div className="absolute bottom-2 right-2 text-[10px] font-label-sm tracking-widest text-outline">RAW 48M</div>
                </div>
              </div>

              {/* Ambient Camera Vignette */}
              <div className="absolute inset-0 bg-gradient-to-b from-surface-container-lowest/60 via-transparent to-surface-container-lowest/80 pointer-events-none"></div>

              {/* Top Icons */}
              <div className="absolute top-0 right-0 z-30 flex items-center justify-center p-4">
                <div className="flex items-center gap-3 px-4 py-2">
                  <Link 
                    aria-label="Alerts" 
                    to="/notifications" 
                    className="text-on-surface hover:text-primary transition-colors flex items-center justify-center font-label-md text-label-md"
                  >
                    <span className="material-symbols-outlined text-[20px]">priority_high</span>
                  </Link>
                  <Link 
                    aria-label="Settings" 
                    to="/settings" 
                    className="text-on-surface hover:text-primary transition-colors flex items-center justify-center font-label-md text-label-md"
                  >
                    @
                  </Link>
                </div>
              </div>

              {/* Shutter and Nav Bar Footer */}
              <div className="relative z-20 w-full mt-auto flex flex-col items-center gap-space-lg pb-safe mb-6 px-margin">
                <div className="flex flex-col items-center gap-2">
                  <button 
                    aria-label="Capture Shutter" 
                    id="shutter-trigger"
                    onClick={triggerShutter}
                    className="relative group w-20 h-20 rounded-full flex items-center justify-center bg-surface-container-high/80 backdrop-blur-xl p-1 shadow-[0_8px_24px_-4px_rgba(0,0,0,0.8)] active:scale-90 transition-transform"
                  >
                    <div className="absolute inset-0 rounded-full bg-surface-container-highest/60 backdrop-blur-md"></div>
                    <div className="absolute inset-1.5 rounded-full bg-surface-container-lowest"></div>
                    <div className="relative w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-md group-hover:scale-95 transition-transform">
                      <div className="w-4 h-4 rounded-full bg-surface/10"></div>
                    </div>
                  </button>
                  {captureCount > 0 && (
                    <span className="font-label-sm text-[10px] text-outline uppercase tracking-wider">
                      {captureCount} captured
                    </span>
                  )}
                </div>

                <div className="flex items-center justify-center gap-2">
                  <div className="bg-surface-container-high/90 backdrop-blur-xl shadow-[0_12px_32px_-4px_rgba(0,0,0,0.7)] rounded-full px-space-sm py-1.5 flex items-center gap-space-xs">
                    <Link 
                      aria-label="Notes" 
                      to="/" 
                      className="min-w-[44px] min-h-[44px] rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors"
                    >
                      <span className="material-symbols-outlined text-[22px]">description</span>
                    </Link>
                    <Link 
                      aria-label="Active Camera" 
                      to="/camera" 
                      className="min-w-[48px] min-h-[48px] rounded-full flex items-center justify-center bg-primary text-on-primary shadow-sm active:scale-95 transition-transform"
                    >
                      <span className="material-symbols-outlined text-[22px]">photo_camera</span>
                    </Link>
                    <Link 
                      aria-label="Gallery" 
                      to="/gallery" 
                      className="min-w-[44px] min-h-[44px] rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors"
                    >
                      <span className="material-symbols-outlined text-[22px]">photo_library</span>
                    </Link>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    };

    // SCREEN 3: Gallery Screen
    const GalleryScreen = () => {
      const [searchOpen, setSearchOpen] = useState(false);

      return (
        <div className="min-h-screen flex flex-col bg-surface text-on-surface selection:bg-surface-container-highest">
          <Header title="Gallery" />
          <main className="flex-1 flex flex-col relative w-full pt-14 pb-28 px-margin bg-surface">
            <div className="flex flex-col w-full h-full min-h-[calc(100vh-140px)] justify-between select-none pt-16 pb-24 px-margin">
              <div className="flex flex-col gap-4 w-full">
                <TactileCardGrid />
              </div>
            </div>
            <SearchOverlay 
              isOpen={searchOpen} 
              onClose={() => setSearchOpen(false)} 
              placeholder="Search gallery & assets..." 
            />
          </main>
          <NavigationBar activeTab="gallery" onToggleSearch={() => setSearchOpen(!searchOpen)} />
        </div>
      );
    };

    // SCREEN 4: Settings Screen
    const SettingsScreen = () => {
      const [searchOpen, setSearchOpen] = useState(false);
      
      // Interactive settings states
      const modes = ['DARK', 'LIGHT', 'OLED'];
      const [modeIndex, setModeIndex] = useState(0);

      const tones = ['SLATE', 'MONO', 'INK'];
      const [toneIndex, setToneIndex] = useState(0);

      const ratios = ['19.5:9', '4:3', '16:9', '1:1'];
      const [ratioIndex, setRatioIndex] = useState(0);

      const [hapticOn, setHapticOn] = useState(true);
      const [privacyOn, setPrivacyOn] = useState(true);

      const nextMode = () => setModeIndex((modeIndex + 1) % modes.length);
      const nextTone = () => setToneIndex((toneIndex + 1) % tones.length);
      const nextRatio = () => setRatioIndex((ratioIndex + 1) % ratios.length);

      return (
        <div className="min-h-screen flex flex-col bg-surface text-on-surface selection:bg-surface-container-highest">
          <Header title="SETTINGS" showSettingsActive={true} />
          
          <main className="flex-1 flex flex-col relative w-full pt-24 pb-28 px-margin bg-surface">
            <div className="flex flex-col w-full max-w-md mx-auto space-y-4 select-none pt-4">
              
              {/* Minimal Tactile Card: Display & Theme */}
              <div className="tactile-card group relative bg-surface-container rounded-2xl p-4 border border-surface-container-highest/40 shadow-sm overflow-hidden">
                <div className="flex items-center justify-between pb-3 border-b border-dashed border-outline-variant/30">
                  <div className="flex items-center gap-2">
                    <span className="font-label-sm text-[11px] text-outline font-semibold tracking-wider">APPEARANCE</span>
                  </div>
                  <span className="font-label-sm text-[10px] text-outline-variant uppercase">v2.4</span>
                </div>
                <div className="divide-y divide-surface-container-highest/50">
                  <button 
                    className="w-full py-3 flex items-center justify-between text-left group/item transition-colors" 
                    onClick={nextMode} 
                    type="button"
                  >
                    <span className="font-body-md text-sm text-on-surface">Display Mode</span>
                    <div className="flex items-center gap-2">
                      <span className="font-label-md text-xs text-primary" id="mode-val">{modes[modeIndex]}</span>
                      <span className="material-symbols-outlined text-[16px] text-outline-variant">chevron_right</span>
                    </div>
                  </button>
                  <button 
                    className="w-full py-3 flex items-center justify-between text-left group/item transition-colors" 
                    onClick={nextTone} 
                    type="button"
                  >
                    <span className="font-body-md text-sm text-on-surface">Accent Tone</span>
                    <div className="flex items-center gap-2">
                      <span className="font-label-md text-xs text-on-surface-variant" id="tone-val">{tones[toneIndex]}</span>
                      <span className="material-symbols-outlined text-[16px] text-outline-variant">chevron_right</span>
                    </div>
                  </button>
                </div>
                <div className="peel-corner absolute bottom-0 right-0 w-6 h-6 pointer-events-none">
                  <div className="peel-flap absolute bottom-0 right-0 w-full h-full bg-surface-container-highest/70 rounded-tl-md shadow-[-2px_-2px_6px_rgba(0,0,0,0.5)]"></div>
                </div>
              </div>

              {/* Minimal Tactile Card: Capture & Optics */}
              <div className="tactile-card group relative bg-surface-container rounded-2xl p-4 border border-surface-container-highest/40 shadow-sm overflow-hidden">
                <div className="flex items-center justify-between pb-3 border-b border-dashed border-outline-variant/30">
                  <div className="flex items-center gap-2">
                    <span className="font-label-sm text-[11px] text-outline font-semibold tracking-wider">OPTICS &amp; INPUT</span>
                  </div>
                  <span className="font-label-sm text-[10px] text-outline-variant uppercase">SENSOR</span>
                </div>
                <div className="divide-y divide-surface-container-highest/50">
                  <button 
                    className="w-full py-3 flex items-center justify-between text-left group/item transition-colors" 
                    onClick={nextRatio} 
                    type="button"
                  >
                    <span className="font-body-md text-sm text-on-surface">Viewfinder Ratio</span>
                    <div className="flex items-center gap-2">
                      <span className="font-label-md text-xs text-on-surface-variant" id="ratio-val">{ratios[ratioIndex]}</span>
                      <span className="material-symbols-outlined text-[16px] text-outline-variant">chevron_right</span>
                    </div>
                  </button>
                  <div className="w-full py-3 flex items-center justify-between">
                    <span className="font-body-md text-sm text-on-surface">Tactile Haptics</span>
                    <button 
                      className={`w-9 h-5 rounded-full relative transition-colors focus:outline-none ${hapticOn ? 'bg-primary' : 'bg-surface-container-highest'}`}
                      id="haptic-toggle" 
                      onClick={() => setHapticOn(!hapticOn)} 
                      type="button"
                    >
                      <span 
                        className={`block w-3.5 h-3.5 rounded-full bg-surface-container-lowest transition-transform ${hapticOn ? 'translate-x-4' : 'translate-x-1'}`}
                        id="haptic-dot"
                      ></span>
                    </button>
                  </div>
                </div>
                <div className="peel-corner absolute bottom-0 right-0 w-6 h-6 pointer-events-none">
                  <div className="peel-flap absolute bottom-0 right-0 w-full h-full bg-surface-container-highest/70 rounded-tl-md shadow-[-2px_-2px_6px_rgba(0,0,0,0.5)]"></div>
                </div>
              </div>

              {/* Minimal Tactile Card: Vault, Storage & System */}
              <div className="tactile-card group relative bg-surface-container rounded-2xl p-4 border border-surface-container-highest/40 shadow-sm overflow-hidden">
                <div className="flex items-center justify-between pb-3 border-b border-dashed border-outline-variant/30">
                  <div className="flex items-center gap-2">
                    <span className="font-label-sm text-[11px] text-outline font-semibold tracking-wider">SYSTEM &amp; VAULT</span>
                  </div>
                  <span className="font-label-sm text-[10px] text-outline-variant uppercase">SECURE</span>
                </div>
                <div className="divide-y divide-surface-container-highest/50">
                  <button className="w-full py-3 flex items-center justify-between text-left group/item transition-colors" type="button">
                    <span className="font-body-md text-sm text-on-surface">Cloud Vault &amp; Sync</span>
                    <div className="flex items-center gap-2">
                      <span className="font-label-md text-xs text-outline">1.2 GB</span>
                      <span className="material-symbols-outlined text-[16px] text-outline-variant">chevron_right</span>
                    </div>
                  </button>
                  <button 
                    className="w-full py-3 flex items-center justify-between text-left group/item transition-colors" 
                    onClick={() => setPrivacyOn(!privacyOn)} 
                    type="button"
                  >
                    <span className="font-body-md text-sm text-on-surface">Privacy &amp; Stripping</span>
                    <div className="flex items-center gap-2">
                      <span className="font-label-md text-xs text-primary">{privacyOn ? 'ON' : 'OFF'}</span>
                      <span className="material-symbols-outlined text-[16px] text-outline-variant">chevron_right</span>
                    </div>
                  </button>
                  <button className="w-full py-3 flex items-center justify-between text-left group/item transition-colors" type="button">
                    <span className="font-body-md text-sm text-on-surface">About &amp; Licenses</span>
                    <span className="material-symbols-outlined text-[16px] text-outline-variant">chevron_right</span>
                  </button>
                </div>
                <div className="peel-corner absolute bottom-0 right-0 w-6 h-6 pointer-events-none">
                  <div className="peel-flap absolute bottom-0 right-0 w-full h-full bg-surface-container-highest/70 rounded-tl-md shadow-[-2px_-2px_6px_rgba(0,0,0,0.5)]"></div>
                </div>
              </div>

              {/* Subtle tactile indicator */}
              <div className="flex items-center justify-center gap-3 pt-3 opacity-40">
                <span className="h-px w-8 bg-outline-variant"></span>
                <span className="font-label-sm text-[10px] tracking-widest text-outline">ENCRYPTED LOCAL STORAGE</span>
                <span className="h-px w-8 bg-outline-variant"></span>
              </div>
            </div>

            <SearchOverlay 
              isOpen={searchOpen} 
              onClose={() => setSearchOpen(false)} 
              placeholder="Search settings..." 
            />
          </main>
          
          <NavigationBar activeTab="settings" onToggleSearch={() => setSearchOpen(!searchOpen)} />
        </div>
      );
    };

    // Notification / Alert Minimal Overlay (supports the alert icon across pages)
    const NotificationsScreen = () => {
      const navigate = useNavigate();

      return (
        <div className="min-h-screen flex flex-col bg-surface text-on-surface selection:bg-surface-container-highest p-6">
          <header className="flex items-center justify-between pt-6 pb-4">
            <button 
              onClick={() => navigate(-1)} 
              className="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high transition-colors"
            >
              <span className="material-symbols-outlined text-[20px]">arrow_back</span>
            </button>
            <h2 className="font-headline-md text-lg tracking-widest uppercase">System Alerts</h2>
            <div className="w-10"></div>
          </header>

          <div className="flex-1 flex flex-col gap-3 mt-4 max-w-md mx-auto w-full">
            <div className="tactile-card bg-surface-container p-4 rounded-2xl border border-surface-container-highest/40 flex items-start gap-3">
              <span className="material-symbols-outlined text-primary text-[20px] mt-0.5">priority_high</span>
              <div className="flex-1">
                <div className="flex justify-between items-center mb-1">
                  <h3 className="font-label-md text-xs font-bold text-on-surface">VAULT SYNCHRONIZED</h3>
                  <span className="font-label-sm text-[10px] text-outline">JUST NOW</span>
                </div>
                <p className="font-body-md text-xs text-on-surface-variant">
                  Encrypted local ledger #4492 has been finalized and locked to hardware key.
                </p>
              </div>
            </div>

            <div className="tactile-card bg-surface-container p-4 rounded-2xl border border-surface-container-highest/40 flex items-start gap-3">
              <span className="material-symbols-outlined text-outline-variant text-[20px] mt-0.5">info</span>
              <div className="flex-1">
                <div className="flex justify-between items-center mb-1">
                  <h3 className="font-label-md text-xs font-bold text-on-surface">OPTICS CALIBRATION</h3>
                  <span className="font-label-sm text-[10px] text-outline">12M AGO</span>
                </div>
                <p className="font-body-md text-xs text-on-surface-variant">
                  Sensor sensitivity set to 19.5:9 aspect ratio standard.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // App Component with MemoryRouter wrapper
    const App = () => {
      return (
        <MemoryRouter initialEntries={["/"]}>
          <Routes>
            <Route path="/" element={<NotesScreen />} />
            <Route path="/notes" element={<NotesScreen />} />
            <Route path="/camera" element={<CameraScreen />} />
            <Route path="/gallery" element={<GalleryScreen />} />
            <Route path="/settings" element={<SettingsScreen />} />
            <Route path="/notifications" element={<NotificationsScreen />} />
          </Routes>
        </MemoryRouter>
      );
    };

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
